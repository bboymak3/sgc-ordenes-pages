name = "sgc-ordenes"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "citas"
database_id = "678b4adc-232d-43db-86ec-230828268161"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "my-emdash-media"

[vars]
ENVIRONMENT = "production"
SGC_SAAS_URL = "https://sgc-saas.activo.workers.dev"

# Secrets (NO van en este archivo):
#   wrangler pages secret put SGC_SAAS_ADMIN_TOKEN --project-name sgc-ordenes
#     (mismo valor que ADMIN_TOKEN del worker sgc-saas; lo usa el proxy
#      functions/api/admin/citas-ia para las citas del bot)
